name: Build Portainer riscv64

on:
  workflow_dispatch:        # Permite rodar manualmente com 1 clique
  push:
    branches: [develop]
    paths:
      - 'Dockerfile.riscv64'
      - '.github/workflows/build-riscv64.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120     # Build pode demorar ~40-60min

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: riscv64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.riscv64
          platforms: linux/riscv64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/portainer-riscv64:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

          - name: Atualizar Docker Hub README
        uses: peter-evans/dockerhub-description@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: isacndevops/portainer-riscv64
          readme-filepath: ./DOCKERHUB_README.md
